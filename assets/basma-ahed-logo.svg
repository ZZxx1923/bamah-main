<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="mark-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7931e"/>
      <stop offset="1" stop-color="#c9701a"/>
    </linearGradient>
  </defs>

  <!-- ============ 1. ICON MARK (standalone, 0,0 - 160,160) ============ -->
  <g>
    <rect x="0" y="0" width="160" height="160" rx="30" fill="url(#mark-grad)"/>
    <text x="80" y="93" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="58" letter-spacing="1" fill="#08090a">BA</text>
    <line x1="34" y1="118" x2="126" y2="118" stroke="#08090a" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <line x1="55" y1="118" x2="55" y2="106" stroke="#08090a" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <line x1="105" y1="118" x2="105" y2="109" stroke="#08090a" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- ============ 2. HORIZONTAL LOCKUP (icon + wordmark, starts x=200) ============ -->
  <g transform="translate(200, 20)">
    <rect x="0" y="0" width="120" height="120" rx="22" fill="url(#mark-grad)"/>
    <text x="60" y="70" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="44" letter-spacing="1" fill="#08090a">BA</text>
    <line x1="26" y1="89" x2="94" y2="89" stroke="#08090a" stroke-width="3" stroke-linecap="round" opacity=".55"/>

    <text x="140" y="52" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="42" letter-spacing="1" fill="#f4f4f1">BASMA <tspan fill="#f7931e">AHED</tspan></text>
    <text x="140" y="80" font-family="JetBrains Mono, monospace" font-weight="500" font-size="14" letter-spacing="2.5" fill="#8b8d8a">GENERAL CONTRACTING CO.</text>
  </g>
</svg>
